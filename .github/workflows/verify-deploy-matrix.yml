name: Verify deploy env matrix

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/verify-deploy-matrix.sh
